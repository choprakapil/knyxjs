name: Deploy to VPS

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Find project directory dynamically
            if [ -d "/root/knyxjs" ]; then
              cd /root/knyxjs
            elif [ -d "/root/knyx" ]; then
              cd /root/knyx
            elif [ -d "/home/kapil/knyxjs" ]; then
              cd /home/kapil/knyxjs
            elif [ -d "/home/kapil/knyx" ]; then
              cd /home/kapil/knyx
            elif [ -d "/var/www/knyxjs" ]; then
              cd /var/www/knyxjs
            else
              echo "Error: Project directory not found on VPS!"
              echo "Listing /root:"
              ls -la /root || true
              echo "Listing /home/kapil:"
              ls -la /home/kapil || true
              echo "Listing /var/www:"
              ls -la /var/www || true
              exit 1
            fi
            
            echo "Working directory is $(pwd)"
            git fetch origin
            git reset --hard origin/live
            npm install
            npm run build
            pm2 restart nextjs-app || pm2 restart all || pm2 start npm --name "nextjs-app" -- run start

