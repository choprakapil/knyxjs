name: Deploy to VPS

on:
  push:
    branches:
      - live

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/kapil/apps/knyxjs
            git fetch origin
            git reset --hard origin/live
            npm install
            npm run build
            pm2 restart nextjs-app || pm2 restart all || pm2 start npm --name "nextjs-app" -- run start
